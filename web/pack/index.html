<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Modpack de Nova Launcher</title>
<!-- Página de «Compartir modpack». Se publica en la web de Nova como /pack (por ejemplo https://…/nova-launcher-web/pack/).
     El modpack viaja en la parte #… de la dirección, que el navegador NUNCA envía a ningún servidor. Aquí solo se comprueba que
     parezca un código válido y se intenta abrir nova://pack?d=…; no se ejecuta ni se descomprime nada. -->
<style>
:root{color-scheme:dark;--bg:#080a0f;--p:#0f1219;--tx:#eef1f8;--m:#8a92a6;--ac:#2ee06f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,Segoe UI,sans-serif;padding:16px}
main{width:100%;max-width:460px;background:var(--p);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:28px}
h1{font-size:20px;margin:0 0 6px}p{color:var(--m);margin:0 0 16px}
.btn{display:block;width:100%;text-align:center;padding:12px 16px;margin:0 0 10px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:transparent;color:var(--tx);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.pr{background:var(--ac);border-color:var(--ac);color:#04140a}
small{display:block;color:var(--m);margin-top:12px;font-size:13px}
.err{color:#ffb24d}
</style>
</head>
<body>
<main>
  <h1>Te han compartido un modpack</h1>
  <p id="msg">Abriendo Nova Launcher…</p>
  <a class="btn pr" id="open" href="#">Abrir en Nova Launcher</a>
  <a class="btn" id="get" href="https://github.com/JustMarcoDev/nova-launcher/releases/latest" rel="noopener">Descargar Nova Launcher</a>
  <button class="btn" id="copy" type="button">Copiar código del modpack</button>
  <small>Si ya tienes Nova Launcher, pulsa «Abrir». Si no, descárgalo, instálalo y vuelve a abrir este enlace (o pega el código en Instancias → Añadir modpack).</small>
</main>
<script>
(function(){
  var d=location.hash.replace(/^#/,''),ok=/^[A-Za-z0-9_-]{8,200000}$/.test(d);
  var msg=document.getElementById('msg'),open=document.getElementById('open'),copy=document.getElementById('copy');
  if(!ok){msg.textContent='Este enlace no contiene un modpack válido.';msg.className='err';open.style.display='none';copy.style.display='none';return}
  var link='nova://pack?d='+d;open.href=link;
  setTimeout(function(){msg.textContent='Si no se ha abierto el launcher, pulsa «Abrir» o descárgalo.'},1500);
  location.href=link;
  copy.onclick=function(){var done=function(){copy.textContent='Código copiado'};try{navigator.clipboard.writeText(d).then(done,function(){})}catch(e){}};
})();
</script>
</body>
</html>
