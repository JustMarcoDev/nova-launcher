org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
# Versión de Minecraft para la que se compila (se cambia con -Pmc=1.20.1)
mc=1.21.1
yarn=1.21.1+build.3
# Capas de código por versión de Minecraft (se cambia con -Players=gui,in-new,btn-old): API (legacy · rl · rl5 · gui · gui11), entrada (in-old · in-new), botón (btn-old · btn-new), HUD (hud-f: render con float, 1.20.x · hud-t: con RenderTickCounter, 1.21+) zoom (fov-d: getFov devuelve double, hasta 1.21.1 · fov-f: float, 1.21.2+) skin local y capa (skin-o: 1.20-1.20.1 · skin-1: 1.20.2-1.21.8 · skin-9: 1.21.9+) y entrar a un servidor (conn-a: 1.20-1.20.1 · conn-b: 1.20.2 · conn-c: 1.20.3-1.20.4 · conn-d: 1.20.5+) · opciones de vídeo (opt-a: ParticlesMode en client.option, hasta 1.21.1 · opt-b: en particle, 1.21.2+) y capturas (shot-a: saveScreenshot sin factor de reducción, hasta 1.21.5 · shot-b: con él, 1.21.6+)
layers=legacy,in-old,btn-old,hud-f,fov-d,skin-o,conn-a,opt-a,shot-a
loader=0.16.14
