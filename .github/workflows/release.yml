name: Crear version

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Leer la versión
        id: v
        shell: bash
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [[ "$VER" == *-* ]]; then echo "pre=true" >> "$GITHUB_OUTPUT"; else echo "pre=false" >> "$GITHUB_OUTPUT"; fi
      - name: Instalar dependencias
        run: npm install
      - name: Revisar el código (si algo falla, no se publica nada)
        run: npm test
      - name: Probar que la app arranca
        run: npm run smoke
      - name: Crear notas de la versión desde el README
        shell: bash
        run: node scripts/release-notes.js "${{ steps.v.outputs.version }}" > release-notes.md
      - name: Borrar restos de un intento anterior de esta misma versión
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Si una ejecución anterior dejó una release (o un borrador) con esta etiqueta, se borra para que no haya dos con el mismo nombre
          TAG="v${{ steps.v.outputs.version }}"
          for ID in $(gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate -q ".[] | select(.tag_name==\"$TAG\") | .id"); do
            echo "Borrando release $ID ($TAG)"; gh api -X DELETE "repos/${{ github.repository }}/releases/$ID" || true
          done
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$TAG" 2>/dev/null || true
      - name: Compilar y subir el instalador
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.v.outputs.pre }}" = "true" ]; then TYPE=prerelease; else TYPE=release; fi
          npx electron-builder --win --publish always -c.publish.releaseType=$TYPE
      - name: Poner las notas en la página de la versión
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"; PRE=${{ steps.v.outputs.pre }}
          # Si la versión ya estaba publicada (por ejemplo al repetir la ejecución) solo se cambian las notas; si es un borrador, se publica.
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = "true" ]; then
            gh release edit "$TAG" --notes-file release-notes.md --draft=false --prerelease=$PRE
          else
            gh release edit "$TAG" --notes-file release-notes.md --prerelease=$PRE
          fi
