name: Crear version

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Leer la versión
        id: v
        shell: bash
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [[ "$VER" == *-* ]]; then echo "pre=true" >> "$GITHUB_OUTPUT"; else echo "pre=false" >> "$GITHUB_OUTPUT"; fi
      - name: Instalar dependencias
        run: npm install
      - name: Revisar el código (si algo falla, no se publica nada)
        run: npm test
      - name: Probar que la app arranca
        run: npm run smoke
      - name: Crear notas de la versión desde el README
        shell: bash
        run: node scripts/release-notes.js "${{ steps.v.outputs.version }}" > release-notes.md
      - name: Compilar y subir el instalador
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.v.outputs.pre }}" = "true" ]; then TYPE=prerelease; else TYPE=release; fi
          npx electron-builder --win --publish always -c.publish.releaseType=$TYPE
      - name: Poner las notas en la página de la versión
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "v${{ steps.v.outputs.version }}" --notes-file release-notes.md --draft=false --prerelease=${{ steps.v.outputs.pre }}
