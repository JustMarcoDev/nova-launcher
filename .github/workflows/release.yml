name: Crear version

on:
  workflow_dispatch:
    inputs:
      solo:
        description: "Solo para depurar el robot: versiones separadas por comas (vacío = todas). Con esto NO se publica nada."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # Robot de pruebas: abre el cliente de CADA versión (las 24 de mod/versions.txt y mod26/versions.txt) en Linux con xvfb-run y el modo
  # -Dnova.selftest=true del mod (pantalla de título = NovaTitleScreen, zoom, menú de pausa, capturas). Si una versión falla, no se publica nada.
  matriz:
    runs-on: ubuntu-latest
    outputs:
      versiones: ${{ steps.m.outputs.versiones }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: m
        run: echo "versiones=$(SOLO='${{ github.event.inputs.solo }}' node scripts/selftest-matriz.js)" >> "$GITHUB_OUTPUT"
  robot:
    needs: matriz
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        v: ${{ fromJson(needs.matriz.outputs.versiones) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.v.tree == 'mod26' && 25 || 21 }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.v.tree == 'mod26' && '9.8.0' || '8.14.3' }}
      - name: Instalar xvfb, Mesa y ImageMagick
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libgl1-mesa-dri libglx-mesa0 libegl1 libsdl3-0 imagemagick x11-utils mesa-utils || sudo apt-get install -y -q xvfb libgl1-mesa-dri libglx-mesa0 libegl1 imagemagick x11-utils mesa-utils
      - name: Mostrar qué OpenGL hay (diagnóstico)
        run: |
          OUT=$(LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render" glxinfo -B 2>&1 | head -25 | tr '\n' '|'); echo "::notice title=OpenGL::$OUT"; nproc; free -m | head -2
      - name: Abrir Minecraft ${{ matrix.v.mc }} y probar el menú de Nova
        run: xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render" bash scripts/selftest.sh "${{ matrix.v.tree }}" "${{ matrix.v.mc }}" "${{ matrix.v.yarn }}" "${{ matrix.v.layers }}" "${{ matrix.v.loader }}" "$GITHUB_WORKSPACE/capturas"
      - name: Subir las capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-${{ matrix.v.mc }}
          path: capturas/
          if-no-files-found: warn
  build:
    needs: robot
    if: ${{ github.event.inputs.solo == '' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Leer la versión
        id: v
        shell: bash
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [[ "$VER" == *-* ]]; then echo "pre=true" >> "$GITHUB_OUTPUT"; else echo "pre=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Compilar el menú de Nova (el .jar siempre sale del código de mod/)
        shell: bash
        working-directory: mod
        run: |
          # Una línea de mod/versions.txt por versión de Minecraft; los .jar sustituyen a los de assets/mods
          mkdir -p ../assets/mods   # los .jar ya no están en git: la carpeta no existe en un clon limpio
          tr -d '\r' < versions.txt | grep -v '^#' | grep -v '^$' | while read -r MC YARN LAYERS; do
            echo "== Menú de Nova para Minecraft $MC"
            OUT=$(gradle build --no-daemon -q -Pmc="$MC" -Pyarn="$YARN" -Players="${LAYERS:-legacy,in-old,btn-old,hud-f,fov-d,skin-o}" 2>&1 < /dev/null) || { echo "::error::Falló la compilación del menú para $MC: $(echo "$OUT" | tail -c 1800 | tr '\n' '|')"; exit 1; }
            JAR=$(ls build/libs/nova-menu-$MC-*.jar | grep -v sources | head -1)
            cp "$JAR" "../assets/mods/nova-menu-$MC.jar"
          done
          ls -la ../assets/mods
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.0
      - name: Compilar el menú de Nova para Minecraft 26.x (Java 25, sin ofuscar)
        shell: bash
        working-directory: mod26
        run: |
          mkdir -p ../assets/mods
          tr -d '\r' < versions.txt | grep -v '^#' | grep -v '^$' | while read -r MC LAYERS; do
            echo "== Menú de Nova para Minecraft $MC"
            OUT=$(gradle build --no-daemon -q -Pmc="$MC" -Players="${LAYERS:-sdl,gui2}" 2>&1 < /dev/null) || { echo "::error::Falló la compilación del menú para $MC: $(echo "$OUT" | tail -c 1800 | tr '\n' '|')"; exit 1; }
            JAR=$(ls build/libs/nova-menu-$MC-*.jar | grep -v sources | head -1)
            cp "$JAR" "../assets/mods/nova-menu-$MC.jar"
          done
          ls -la ../assets/mods
      - name: Instalar dependencias
        run: npm install
      - name: Descargar los recursos que no están en git (fondo del instalador, de la release «recursos»)
        run: node scripts/recursos.js bajar nova-bg.nvb
      - name: Revisar el código (si algo falla, no se publica nada)
        run: npm test
      - name: Probar que la app arranca
        run: npm run smoke
      - name: Minificar el código de la app (solo en esta copia; el repositorio no cambia)
        shell: bash
        run: |
          # Se hace después de las pruebas: tests/ y el smoke trabajan con el código sin minificar
          npx --yes esbuild@0.25.0 js/*.js --minify --allow-overwrite --outdir=js
          npx --yes esbuild@0.25.0 lang/*.js --minify --allow-overwrite --outdir=lang
          npx --yes esbuild@0.25.0 css/style.css --minify --allow-overwrite --outfile=css/style.css
      - name: Crear notas de la versión desde el README
        shell: bash
        run: node scripts/release-notes.js "${{ steps.v.outputs.version }}" > release-notes.md
      - name: Borrar restos de un intento anterior de esta misma versión
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Si una ejecución anterior dejó una release (o un borrador) con esta etiqueta, se borra para que no haya dos con el mismo nombre
          TAG="v${{ steps.v.outputs.version }}"
          for ID in $(gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate -q ".[] | select(.tag_name==\"$TAG\") | .id"); do
            echo "Borrando release $ID ($TAG)"; gh api -X DELETE "repos/${{ github.repository }}/releases/$ID" || true
          done
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$TAG" 2>/dev/null || true
      - name: Compilar y subir el instalador
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma de código (opcional): si existen estos secretos, el instalador y la app salen firmados y Windows SmartScreen no avisa.
          # CSC_LINK = el certificado .pfx en base64; CSC_KEY_PASSWORD = su contraseña. Mira «Firma del instalador» en el README.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.v.outputs.pre }}" = "true" ]; then TYPE=prerelease; else TYPE=release; fi
          if [ -n "$CSC_LINK" ]; then echo "Firmando con el certificado de los secretos"; else echo "::warning::Sin certificado de firma: Windows SmartScreen avisará al instalar (mira el README)"; unset CSC_LINK CSC_KEY_PASSWORD; fi
          # En el CI se escriben los datos del .exe (nombre, versión, empresa) y, si hay certificado, se firma
          npx electron-builder --win --publish always -c.win.signAndEditExecutable=true -c.publish.releaseType=$TYPE
      - name: Mostrar si el instalador está firmado
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe | ForEach-Object { $s = Get-AuthenticodeSignature $_.FullName; Write-Host ($_.Name + ' -> ' + $s.Status + ' ' + $s.SignerCertificate.Subject) }
      - name: Comprobar que la release tiene latest.yml (lo necesita el actualizador del launcher)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          NAMES=$(gh release view "$TAG" --json assets -q '.assets[].name'); echo "$NAMES"
          if ! echo "$NAMES" | grep -qx 'latest.yml'; then
            # Las versiones beta pueden publicar solo beta.yml: se sube también como latest.yml
            YML=$(ls dist/*.yml 2>/dev/null | head -1)
            if [ -z "$YML" ]; then echo "::error::No hay ningún .yml de actualización en dist/"; exit 1; fi
            cp "$YML" dist/latest.yml; gh release upload "$TAG" dist/latest.yml --clobber
          fi
      - name: Subir el menú de Nova (.jar y nova-menu.json) para actualizarlo sin nueva versión del launcher
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          node scripts/nova-menu-json.js "${{ steps.v.outputs.version }}"
          gh release upload "$TAG" assets/mods/nova-menu-*.jar dist/nova-menu.json --clobber
      - name: Firmar nova-menu.json, fondos.json y nova-config.json (ed25519, secreto NOVA_SIGN_KEY)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOVA_SIGN_KEY: ${{ secrets.NOVA_SIGN_KEY }}
        run: |
          # El launcher solo usa estos archivos si traen una firma válida (main/firma.js). Sin el secreto no se firma nada y el launcher usa lo incluido.
          if [ -z "$NOVA_SIGN_KEY" ]; then echo "::warning::Falta el secreto NOVA_SIGN_KEY: no se firma nada y el launcher ignorará nova-menu.json, fondos.json y nova-config.json (mira «Firma de lo que se descarga» en el README)"; exit 0; fi
          TAG="v${{ steps.v.outputs.version }}"
          mkdir -p firmas && cd firmas
          cp ../dist/nova-menu.json .
          gh release download recursos -p fondos.json -p nova-config.json --clobber || true
          [ -f nova-config.json ] || cp ../scripts/nova-config.base.json nova-config.json   # primera vez: todo encendido y sin aviso; después se edita en la release «recursos»
          FILES="nova-menu.json nova-config.json"; [ -f fondos.json ] && FILES="$FILES fondos.json"
          node ../scripts/firmar.js firmar $FILES
          node ../scripts/firmar.js verificar $FILES
          gh release upload "$TAG" nova-menu.json.sig --clobber
          gh release upload recursos nova-config.json nova-config.json.sig --clobber
          [ -f fondos.json ] && gh release upload recursos fondos.json.sig --clobber
          echo "Firmados: $FILES"
      - name: Poner las notas en la página de la versión
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"; PRE=${{ steps.v.outputs.pre }}
          # Si la versión ya estaba publicada (por ejemplo al repetir la ejecución) solo se cambian las notas; si es un borrador, se publica.
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = "true" ]; then
            gh release edit "$TAG" --notes-file release-notes.md --draft=false --prerelease=$PRE
          else
            gh release edit "$TAG" --notes-file release-notes.md --prerelease=$PRE
          fi
