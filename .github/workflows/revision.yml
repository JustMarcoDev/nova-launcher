name: Revision

# Se ejecuta sola cada vez que subes cambios (git push): avisa si algo se ha roto, sin publicar nada.
on:
  push:
  pull_request:

jobs:
  revisar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Descargar el fondo de la release «recursos» (no está en git)
        run: node scripts/recursos.js bajar nova-bg.nvb
      - name: Revisar el código
        env:
          NOVA_SIN_JARS: "1"   # los .jar del menú de Nova no están en git: los compila «Crear version»
        run: npm test
      - name: Probar que la app arranca
        run: npm run smoke
