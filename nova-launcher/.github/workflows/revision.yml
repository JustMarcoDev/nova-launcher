name: Revision

# Se ejecuta sola cada vez que subes cambios (git push): avisa si algo se ha roto, sin publicar nada.
on:
  push:
  pull_request:

jobs:
  revisar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Revisar el código
        run: npm test
      - name: Probar que la app arranca
        run: npm run smoke
