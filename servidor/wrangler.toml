name = "nova-presencia"
main = "worker.js"
compatibility_date = "2024-09-01"

# KV: solo para /challenge y los tokens de /verify (con caducidad).
# Crea el KV con:  npx wrangler kv namespace create NOVA   y pega aquí el id que te devuelve
[[kv_namespaces]]
binding = "NOVA"
id = "PEGA_AQUI_EL_ID_DEL_KV"

# Durable Object global «Presence»: presencia en memoria y límites de peticiones.
# new_sqlite_classes es la migración que admite el plan gratis de Cloudflare.
[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "Presence"

# Durable Object «Cloud»: ajustes en la nube (uno por jugador, con SQLite).
[[durable_objects.bindings]]
name = "CLOUD"
class_name = "Cloud"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Presence"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Cloud"]

# Opcional: peticiones por minuto por IP y por token (por defecto 10)
# [vars]
# RATE_LIMIT = "10"
